name: Build Android APK # personal test build: debug-signed release artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-build-and-ci
      - release/clearance-safety-and-signing
    paths:
      - 'android/**'
      - 'www/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          bash ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK (debug certificate for personal testing)
        run: |
          cd android
          bash ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: TowGuide-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TowGuide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
